name: Veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prüft Inhalte, TypeScript und baut nach dist/
      - run: npm run build
        env:
          # optional: Login (siehe docs/LOGIN.md). Ohne diese Geheimnisse ist die App ohne Anmeldung offen.
          AZUBI_LOGIN_USER: ${{ secrets.AZUBI_LOGIN_USER }}
          AZUBI_LOGIN_PASS: ${{ secrets.AZUBI_LOGIN_PASS }}
      # GitHub Pages hat keinen SPA-Fallback: unbekannte Pfade (/p/…) bekommen die App
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
