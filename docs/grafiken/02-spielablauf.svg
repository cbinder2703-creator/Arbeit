<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><rect width="1600" height="980" fill="#070A14"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#94A3B8"/></marker></defs><text x="60" y="66" font-family="Nunito, Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#F1F5F9" text-anchor="start">Ablauf einer Spielrunde</text><text x="60" y="98" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" text-anchor="start">Jede Prüfung ist ein eigenes Spiel – darin steuert die Engine Runde, Punkte und Wiederholung</text><rect x="60" y="150" width="200" height="80" rx="16" fill="#151B2E" stroke="#10B981" stroke-width="2" /><text x="160.0" y="186.0" font-family="Nunito, Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#F1F5F9" text-anchor="middle">Prüfung wählen</text><text x="160.0" y="208.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">= Spiel öffnen</text><rect x="300" y="150" width="190" height="80" rx="16" fill="#151B2E" stroke="#3B82F6" stroke-width="2" /><text x="395.0" y="186.0" font-family="Nunito, Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#F1F5F9" text-anchor="middle">Kapitel wählen</text><text x="395.0" y="208.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">oder „Heute dran“</text><rect x="530" y="150" width="190" height="80" rx="16" fill="#151B2E" stroke="#3B82F6" stroke-width="2" /><text x="625.0" y="186.0" font-family="Nunito, Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#F1F5F9" text-anchor="middle">Modus wählen</text><text x="625.0" y="208.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12"